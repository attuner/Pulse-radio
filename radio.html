<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE RADIO // LIVE STREAM</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-primary: #090A0F;
      --bg-card: rgba(22, 27, 34, 0.75);
      --border-line: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00F0FF;
      --accent-violet: #7928CA;
      --accent-crimson: #FF3B30;
      --text-main: #F0F6FC;
      --text-muted: #8B949E;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(121, 40, 202, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .unmute-pill {
      position: fixed;
      top: 16px;
      background: rgba(0, 240, 255, 0.9);
      color: #000;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
      cursor: pointer;
      z-index: 10000;
      display: none;
      align-items: center;
      gap: 6px;
      animation: pillFloat 2s ease-in-out infinite;
    }

    @keyframes pillFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 59, 48, 0.15);
      border: 1px solid var(--accent-crimson);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-crimson);
      letter-spacing: 1px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-crimson);
      box-shadow: 0 0 8px var(--accent-crimson);
      animation: livePulse 1.5s infinite;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .listeners-count {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-cyan);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .deck-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        #111,
        #111 2px,
        #181818 3px,
        #181818 4px
      );
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 0 4px rgba(255, 255, 255, 0.05);
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .vinyl.spinning {
      animation: spinRecord 6s linear infinite;
    }

    @keyframes spinRecord {
      100% { transform: rotate(360deg); }
    }

    .vinyl-label {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      border: 4px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
    }

    .center-hole {
      width: 16px;
      height: 16px;
      background: #000;
      border-radius: 50%;
    }

    .vis-canvas {
      width: 100%;
      height: 120px;
      margin: 12px 0;
      border-radius: 8px;
    }

    .meta-panel {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }

    .track-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .track-contributor {
      font-size: 0.9rem;
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      margin-bottom: 4px;
    }

    .track-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .live-progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .live-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan));
      transition: width 0.25s linear;
    }

    /* RESTORED PREVIOUS & NEXT CONTROLS */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 32px;
    }

    .ctrl-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      color: var(--text-main);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover {
      border-color: var(--accent-cyan);
      transform: scale(1.05);
    }

    .ctrl-btn.btn-play {
      width: 72px;
      height: 72px;
      background: var(--accent-cyan);
      color: #000;
      border: none;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .ctrl-btn.btn-play:hover {
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
      transform: scale(1.06);
    }

    .ctrl-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .btn-play svg {
      width: 32px;
      height: 32px;
    }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      width: 100%;
      max-width: 260px;
    }

    .volume-slider {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-cyan);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    /* RECENTLY PLAYED HISTORY DRAWER */
    .queue-panel {
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-line);
    }

    .queue-header h4 {
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .queue-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .queue-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .queue-tag {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid var(--accent-cyan);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      transform: translateY(100px);
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    .toast.visible {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div id="unmutePill" class="unmute-pill" onclick="handleUserUnlockInteraction()">
    <span>🔊 TAP ANYWHERE TO UNMUTE</span>
  </div>

  <div class="container">
    <header>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>ON AIR</span>
      </div>
      <div class="listeners-count" id="listenerReadout">LISTENERS: 1 ACTIVE</div>
    </header>

    <div class="deck-container">
      <div id="vinylDisk" class="vinyl">
        <div class="vinyl-label">
          <div class="center-hole"></div>
        </div>
      </div>
    </div>

    <canvas id="visCanvas" class="vis-canvas"></canvas>

    <div class="meta-panel">
      <div id="currentTitle" class="track-title">Connecting to Broadcast Stream...</div>
      <div id="currentContributor" class="track-contributor">--</div>
      <div id="currentTimestamp" class="track-time">--:--:--</div>
    </div>

    <div class="live-progress-container">
      <div id="streamProgressBar" class="live-progress-bar"></div>
    </div>

    <!-- RESTORED NAVIGATION CONTROLS: PREVIOUS, PLAY/PAUSE, NEXT -->
    <div class="controls">
      <button class="ctrl-btn" onclick="skipToPreviousTrack()" title="Previous Transmission">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button id="masterPlayBtn" class="ctrl-btn btn-play" onclick="togglePlayback()" title="Play / Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="ctrl-btn" onclick="skipToNextTrack()" title="Next Transmission">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="volume-group">
      <svg style="width:18px;height:18px;fill:var(--text-muted);" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
      <input type="range" id="volSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.85" oninput="handleVolumeChange(event)">
    </div>

    <!-- RECENTLY PLAYED HISTORY DRAWER (LAST 3 TRACKS) -->
    <div class="queue-panel">
      <div class="queue-header">
        <h4>Recently Played (Last 3 Tracks)</h4>
        <span id="historyCount" style="font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);">0 Records</span>
      </div>
      <ul id="recentlyPlayedList" class="queue-list"></ul>
    </div>
  </div>

  <div id="toastNotification" class="toast"></div>

  <!-- PERSISTENT BROADCAST & WEBRTC OVERLAY AUDIO ELEMENTS -->
  <audio id="radioAudio" playsinline webkit-playsinline preload="auto"></audio>
  <audio id="voiceoverAudio" playsinline webkit-playsinline autoplay></audio>

  <script>
    /**
     * ENDPOINT CONFIGURATION: Paste your deployed Google Apps Script URL below
     */
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzSY4pGUK9WEEnTKjkZ50MOAc5hYjVcxQmuJp5mL9wheuTDgLvQEoHqPyYurfyo5fuL/exec";
    const POLL_INTERVAL = 15000;
    const WEBRTC_ROOM_ID = "pulse-radio-live-broadcast-room-2026";

    // Audio Engine State
    let audioCtx = null;
    let analyser = null;
    let audioSource = null;
    let isPlaying = false;
    let currentTrackIndex = 0;
    let animationFrame = null;
    let currentBlobUrl = null;
    let isTrackLoading = false;
    let userBaseVolume = 0.85;

    // Ephemeral Client Listener ID
    let listenerSessionId = localStorage.getItem("PULSE_RADIO_LISTENER_ID");
    if (!listenerSessionId) {
      listenerSessionId = "listener_" + Math.random().toString(36).substring(2, 12);
      localStorage.setItem("PULSE_RADIO_LISTENER_ID", listenerSessionId);
    }

    // Queues & History
    let currentQueue = [];
    let priorityQueue = [];
    let recentlyPlayedHistory = [];
    let pollTimerId = null;

    // WebRTC Listener Client
    let listenerPeer = null;
    let hostDataConn = null;
    let hostMediaCall = null;

    const audioElement = document.getElementById("radioAudio");
    const voiceoverElement = document.getElementById("voiceoverAudio");

    window.addEventListener("DOMContentLoaded", () => {
      initAudioElementListeners();
      initVisibilityChangeHandler();
      setupGlobalAutoplayUnlockListener();
      bootstrapLiveStation();
      initWebRTCListener();
    });

    function showToast(message) {
      const toast = document.getElementById("toastNotification");
      toast.textContent = message;
      toast.classList.add("visible");
      setTimeout(() => { toast.classList.remove("visible"); }, 4000);
    }

    function setupGlobalAutoplayUnlockListener() {
      const unlockEvents = ["click", "touchstart", "keydown"];
      const unlocker = () => {
        handleUserUnlockInteraction();
        unlockEvents.forEach(evt => document.removeEventListener(evt, unlocker));
      };
      unlockEvents.forEach(evt => document.addEventListener(evt, unlocker));
    }

    function handleUserUnlockInteraction() {
      const pill = document.getElementById("unmutePill");
      pill.style.display = "none";

      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      audioElement.muted = false;
      audioElement.volume = userBaseVolume;

      if (audioElement.paused && currentQueue.length > 0) {
        audioElement.play().catch(err => console.warn("Playback resume retry:", err));
      }
    }

    async function bootstrapLiveStation() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        try {
          audioSource = audioCtx.createMediaElementSource(audioElement);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.85;
          audioSource.connect(analyser);
          analyser.connect(audioCtx.destination);
          renderVisualizer();
        } catch (e) {
          console.warn("Visualizer operating in fallback mode.");
        }

        audioElement.volume = userBaseVolume;

        await fetchLiveManifest();
        pollTimerId = setInterval(fetchLiveManifest, POLL_INTERVAL);
      } catch (err) {
        console.error("Bootstrap error:", err);
      }
    }

    // WebRTC Real-Time Listener Initialization
    function initWebRTCListener() {
      try {
        listenerPeer = new Peer({ debug: 1 });

        listenerPeer.on("open", () => {
          connectToBroadcastHost();
        });

        listenerPeer.on("call", (call) => {
          hostMediaCall = call;
          call.answer(); // Auto-answer broadcast stream
          call.on("stream", (remoteStream) => {
            voiceoverElement.srcObject = remoteStream;
            voiceoverElement.volume = 1.0;
            voiceoverElement.play().catch(e => console.warn("Live stream voice autoplay:", e));
          });
        });
      } catch (e) {
        console.warn("WebRTC listener peer init:", e);
      }
    }

    function connectToBroadcastHost() {
      if (!listenerPeer || listenerPeer.destroyed) return;

      hostDataConn = listenerPeer.connect(WEBRTC_ROOM_ID);

      hostDataConn.on("open", () => {
        // Request media call if host is broadcasting
        const dummyCanvas = document.createElement("canvas");
        const dummyStream = dummyCanvas.captureStream ? dummyCanvas.captureStream() : null;
        if (dummyStream) {
          const call = listenerPeer.call(WEBRTC_ROOM_ID, dummyStream);
          call.on("stream", (remoteStream) => {
            voiceoverElement.srcObject = remoteStream;
            voiceoverElement.volume = 1.0;
            voiceoverElement.play().catch(e => console.warn("Live stream voice:", e));
          });
        }
      });

      hostDataConn.on("data", (data) => {
        if (data.type === "VOICEOVER_START") {
          showToast(`⚡ Live Contributor Voiceover: @${data.uploader || "Host"}`);
          duckMainVolume(0.15, 100);
        } else if (data.type === "VOICEOVER_END") {
          restoreMainVolume(250);
          voiceoverElement.srcObject = null;
        }
      });

      hostDataConn.on("close", () => {
        setTimeout(connectToBroadcastHost, 10000);
      });

      hostDataConn.on("error", () => {
        setTimeout(connectToBroadcastHost, 15000);
      });
    }

    function duckMainVolume(targetVolRatio, durationMs) {
      const startVol = audioElement.volume;
      const targetVol = userBaseVolume * targetVolRatio;
      const steps = 10;
      const stepInterval = durationMs / steps;
      let currentStep = 0;

      const duckTimer = setInterval(() => {
        currentStep++;
        audioElement.volume = Math.max(0.05, startVol + ((targetVol - startVol) * (currentStep / steps)));
        if (currentStep >= steps) {
          clearInterval(duckTimer);
          audioElement.volume = targetVol;
        }
      }, stepInterval);
    }

    function restoreMainVolume(durationMs = 250) {
      const startVol = audioElement.volume;
      const targetVol = userBaseVolume;
      const steps = 10;
      const stepInterval = durationMs / steps;
      let currentStep = 0;

      const restoreTimer = setInterval(() => {
        currentStep++;
        audioElement.volume = Math.min(1.0, startVol + ((targetVol - startVol) * (currentStep / steps)));
        if (currentStep >= steps) {
          clearInterval(restoreTimer);
          audioElement.volume = targetVol;
        }
      }, stepInterval);
    }

    function initAudioElementListeners() {
      audioElement.addEventListener("ended", handleTrackEnded);
      
      audioElement.addEventListener("timeupdate", () => {
        if (!audioElement.duration) return;
        const progress = (audioElement.currentTime / audioElement.duration) * 100;
        document.getElementById("streamProgressBar").style.width = progress + "%";
        
        const curSec = Math.floor(audioElement.currentTime);
        const durSec = Math.floor(audioElement.duration);
        document.getElementById("currentTimestamp").textContent = 
          `${formatTime(curSec)} / ${formatTime(durSec)}`;
      });

      audioElement.addEventListener("error", (e) => {
        const err = audioElement.error;
        let details = "Unknown Media Error";
        if (err) {
          switch (err.code) {
            case MediaError.MEDIA_ERR_ABORTED: details = "Playback aborted"; break;
            case MediaError.MEDIA_ERR_NETWORK: details = "Network error downloading audio"; break;
            case MediaError.MEDIA_ERR_DECODE: details = "Audio decode corrupted/unsupported"; break;
            case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED: details = "Audio source format not supported"; break;
          }
          if (err.message) details += " - " + err.message;
        }
        console.error("Audio playback failure:", details, e);
        showToast(`Skipped track (${details}). Advancing...`);
        setTimeout(skipToNextTrack, 1500);
      });

      audioElement.addEventListener("play", () => {
        isPlaying = true;
        updatePlayStateUI();
      });

      audioElement.addEventListener("pause", () => {
        isPlaying = false;
        updatePlayStateUI();
      });
    }

    // Media Session Integration with Restored Hardware Skipping
    function syncMediaSession(track) {
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || track.fileName,
          artist: "Contributor: " + (track.uploaderName || "Anonymous"),
          album: "Pulse Radio // Live 50-Buffer",
          artwork: [
            { src: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=512&q=80", sizes: "512x512", type: "image/jpeg" }
          ]
        });

        navigator.mediaSession.setActionHandler("play", () => togglePlayback());
        navigator.mediaSession.setActionHandler("pause", () => togglePlayback());
        navigator.mediaSession.setActionHandler("nexttrack", () => skipToNextTrack());
        navigator.mediaSession.setActionHandler("previoustrack", () => skipToPreviousTrack());
      }
    }

    // Manifest Polling & Heartbeat
    async function fetchLiveManifest() {
      try {
        const endpoint = `${GAS_ENDPOINT_URL}?action=getLiveManifest&listenerId=${encodeURIComponent(listenerSessionId)}`;
        const res = await fetch(endpoint, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (json.success && json.data) {
          if (json.data.activeListeners !== undefined) {
            document.getElementById("listenerReadout").textContent = 
              `LISTENERS: ${json.data.activeListeners} ACTIVE`;
          }

          if (json.data.manifest) {
            reconcileIncomingManifest(json.data.manifest);
          }
        }
      } catch (err) {
        console.warn("Background manifest poll failed. Will retry.", err);
      }
    }

    function reconcileIncomingManifest(incomingTracks) {
      if (incomingTracks.length === 0) {
        document.getElementById("currentTitle").textContent = "Station Idle: No active broadcasts found.";
        return;
      }

      if (currentQueue.length === 0) {
        currentQueue = incomingTracks;
        currentTrackIndex = 0;
        loadAndPlayTrack(currentQueue[0]);
        return;
      }

      const existingIds = new Set(currentQueue.map(t => t.contentId));
      const newlyAddedTracks = incomingTracks.filter(t => !existingIds.has(t.contentId));

      if (newlyAddedTracks.length > 0) {
        newlyAddedTracks.forEach(newTrack => {
          priorityQueue.push(newTrack);
        });
        showToast("New transmission received! Up next immediately after current track.");
      }

      const activeContentId = currentQueue[currentTrackIndex]?.contentId;
      currentQueue = incomingTracks;

      const newIndex = currentQueue.findIndex(t => t.contentId === activeContentId);
      if (newIndex !== -1) {
        currentTrackIndex = newIndex;
      }
    }

    // Queue Navigation & History Logging
    function handleTrackEnded() {
      const finishedTrack = currentQueue[currentTrackIndex];
      if (finishedTrack) {
        recordTrackToRecentlyPlayed(finishedTrack);
      }

      if (priorityQueue.length > 0) {
        const nextUrgentTrack = priorityQueue.shift();
        const foundIdx = currentQueue.findIndex(t => t.contentId === nextUrgentTrack.contentId);
        if (foundIdx !== -1) currentTrackIndex = foundIdx;
        loadAndPlayTrack(nextUrgentTrack);
      } else {
        skipToNextTrack();
      }
    }

    function skipToNextTrack() {
      if (currentQueue.length === 0) return;
      const finishedTrack = currentQueue[currentTrackIndex];
      if (finishedTrack) {
        recordTrackToRecentlyPlayed(finishedTrack);
      }
      currentTrackIndex++;
      if (currentTrackIndex >= currentQueue.length) {
        currentTrackIndex = 0;
      }
      loadAndPlayTrack(currentQueue[currentTrackIndex]);
    }

    function skipToPreviousTrack() {
      if (currentQueue.length === 0) return;
      currentTrackIndex--;
      if (currentTrackIndex < 0) {
        currentTrackIndex = currentQueue.length - 1;
      }
      loadAndPlayTrack(currentQueue[currentTrackIndex]);
    }

    function recordTrackToRecentlyPlayed(track) {
      recentlyPlayedHistory.unshift({
        title: track.title || track.fileName,
        uploaderUsername: track.uploaderUsername,
        durationSeconds: track.durationSeconds || 0,
        completedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      if (recentlyPlayedHistory.length > 3) {
        recentlyPlayedHistory.pop();
      }

      renderRecentlyPlayedList();
    }

    function renderRecentlyPlayedList() {
      const list = document.getElementById("recentlyPlayedList");
      list.innerHTML = "";
      document.getElementById("historyCount").textContent = `${recentlyPlayedHistory.length} / 3 Logged`;

      if (recentlyPlayedHistory.length === 0) {
        list.innerHTML = `<li style="font-size:0.8rem;color:var(--text-muted);padding:8px 0;">No completed transmissions yet.</li>`;
        return;
      }

      recentlyPlayedHistory.forEach((item) => {
        const li = document.createElement("li");
        li.className = "queue-item";
        li.innerHTML = `
          <div class="queue-left">
            <span class="queue-tag">PLAYED</span>
            <div>
              <div style="font-weight:600;">${item.title}</div>
              <div style="font-size:0.75rem;color:var(--text-muted);">@${item.uploaderUsername} &bull; ${item.completedAt}</div>
            </div>
          </div>
          <div style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted);">
            ${formatTime(item.durationSeconds)}
          </div>
        `;
        list.appendChild(li);
      });
    }

    // Proxied Audio Loader
    async function loadAndPlayTrack(track) {
      if (!track || isTrackLoading) return;
      isTrackLoading = true;

      document.getElementById("currentTitle").textContent = "Buffering: " + (track.title || track.fileName);
      document.getElementById("currentContributor").textContent = `BROADCAST BY @${track.uploaderUsername} (${track.uploaderName})`;

      try {
        const streamUrl = `${GAS_ENDPOINT_URL}?action=streamAudio&fileId=${encodeURIComponent(track.fileId)}`;
        const res = await fetch(streamUrl, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (!json.success || !json.base64) {
          throw new Error(json.error || "Backend stream returned invalid payload");
        }

        const byteCharacters = atob(json.base64);
        const byteNumbers = new Uint8Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }

        const audioBlob = new Blob([byteNumbers], { type: json.mimeType || track.mimeType || "audio/webm" });

        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl);
        }

        currentBlobUrl = URL.createObjectURL(audioBlob);
        audioElement.src = currentBlobUrl;
        audioElement.load();

        const playPromise = audioElement.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.warn("Unmuted autoplay restricted. Displaying unmute pill.");
            audioElement.muted = true;
            audioElement.play().catch(e => console.warn("Muted playback attempt:", e));
            document.getElementById("unmutePill").style.display = "inline-flex";
          });
        }

        document.getElementById("currentTitle").textContent = track.title || track.fileName;
        syncMediaSession(track);
      } catch (err) {
        console.error("Failed to stream audio via proxy:", err);
        showToast("Error buffering track: " + err.message);
        setTimeout(skipToNextTrack, 1500);
      } finally {
        isTrackLoading = false;
      }
    }

    function togglePlayback() {
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      if (audioElement.muted) {
        audioElement.muted = false;
      }
      if (audioElement.paused) {
        audioElement.play();
      } else {
        audioElement.pause();
      }
    }

    function handleVolumeChange(e) {
      userBaseVolume = parseFloat(e.target.value);
      audioElement.volume = userBaseVolume;
    }

    function updatePlayStateUI() {
      const disk = document.getElementById("vinylDisk");
      const playIcon = document.getElementById("playIcon");

      if (isPlaying) {
        disk.classList.add("spinning");
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        disk.classList.remove("spinning");
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function renderVisualizer() {
      const canvas = document.getElementById("visCanvas");
      const ctx = canvas.getContext("2d");
      
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.scale(dpr, dpr);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        animationFrame = requestAnimationFrame(draw);
        if (document.hidden) return;

        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

        const barCount = 48;
        const barWidth = (canvas.clientWidth / barCount) - 2;
        let x = 0;

        for (let i = 0; i < barCount; i++) {
          const barHeight = (dataArray[i * 2] / 255) * canvas.clientHeight * 0.9;
          
          const gradient = ctx.createLinearGradient(0, canvas.clientHeight, 0, 0);
          gradient.addColorStop(0, "#7928CA");
          gradient.addColorStop(1, "#00F0FF");

          ctx.fillStyle = gradient;
          ctx.fillRect(x, canvas.clientHeight - barHeight, barWidth, barHeight);

          x += barWidth + 2;
        }
      }
      draw();
    }

    function initVisibilityChangeHandler() {
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (animationFrame) cancelAnimationFrame(animationFrame);
        } else {
          if (analyser) renderVisualizer();
        }
      });
    }

    function formatTime(seconds) {
      const s = parseInt(seconds, 10) || 0;
      const mins = Math.floor(s / 60);
      const secs = s % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
  </script>
